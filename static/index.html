<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08111f">
    <title>Alpha Call</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <main class="app-shell">
        <section id="lobbyView" class="lobby-screen">
            <div class="lobby-mark">AC</div>
            <p class="eyebrow">PRIVATE GROUP CALL</p>
            <h1>Talk together,<br><em>stay close.</em></h1>
            <p class="lobby-copy">A simple audio call for your channel. Video is always optional.</p>
            <div class="join-card">
                <label for="usernameInput">Your name</label>
                <input id="usernameInput" maxlength="20" autocomplete="name" placeholder="e.g. Operator-848">
                <label for="roomInput">Room</label>
                <input id="roomInput" value="ALPHA-1" readonly>
                <button id="btnJoin" class="primary-button" type="button">Join call <span>→</span></button>
            </div>
            <p class="privacy-note">Microphone access is required. Camera stays off until you choose it.</p>
        </section>

        <section id="deviceView" class="call-screen hidden">
            <header class="call-header">
                <button class="icon-button" id="btnMinimize" type="button" aria-label="Minimize call">⌄</button>
                <div class="call-heading">
                    <h1 id="callRoom">ALPHA-1</h1>
                    <p id="callTitle">Group voice call</p>
                </div>
                <button class="icon-button" id="btnMore" type="button" aria-label="More options">⋮</button>
            </header>

            <div class="call-status">
                <span class="status-dot"></span>
                <span id="connectionStatus">Link active</span>
                <span class="status-divider">·</span>
                <span id="peersCount">1 online</span>
            </div>

            <section class="call-stage" aria-label="Call participants">
                <div id="peersList" class="peers-list single-call"></div>
                <div class="audio-activity">
                    <canvas id="audioCanvas"></canvas>
                </div>
                <p id="speakerNotice" class="speaker-notice">Ready to talk</p>
            </section>

            <section id="videoPanel" class="video-panel hidden" aria-label="Video call">
                <div class="video-panel-header">
                    <span>VIDEO</span>
                    <button id="btnCamera" class="small-control active" type="button" aria-pressed="true">Camera on</button>
                </div>
                <div class="video-grid">
                    <div class="video-tile local-video-tile">
                        <video id="localVideo" autoplay muted playsinline></video>
                        <span class="video-name">YOU</span>
                        <button class="fullscreen-button" type="button" aria-label="Watch your video fullscreen">↗</button>
                    </div>
                    <div id="remoteVideos" class="remote-videos"></div>
                </div>
            </section>

            <nav class="call-controls" aria-label="Call controls">
                <button id="btnSpeaker" class="round-control active" type="button" aria-pressed="true">
                    <span class="control-icon">◖))</span><span>Speaker</span>
                </button>
                <button id="btnCameraToggle" class="round-control" type="button">
                    <span class="control-icon">▣</span><span>Camera</span>
                </button>
                <button id="btnMembers" class="round-control" type="button">
                    <span class="control-icon">◉◉</span><span>Members</span>
                </button>
                <button id="btnMoreCall" class="round-control" type="button">
                    <span class="control-icon">•••</span><span>More</span>
                </button>
            </nav>

            <div class="talk-area">
                <button id="btnPttLock" class="lock-control" type="button" aria-pressed="false">
                    <span class="lock-symbol">♙</span><span>Lock PTT</span>
                </button>
                <div id="pttRing" class="ptt-ring">
                    <button id="pttButton" class="ptt-button" type="button">
                        <span class="mic-symbol"></span>
                        <strong id="pttLabel">HOLD TO TALK</strong>
                        <small id="pttHint">PUSH TO TRANSMIT</small>
                    </button>
                </div>
                <button id="btnLeave" class="leave-control" type="button">
                    <span class="hangup-symbol">⌕</span><span>Leave</span>
                </button>
            </div>
            <label class="spacebar-option"><input id="chkSpacebar" type="checkbox" checked> Spacebar to talk</label>
        </section>
    </main>
    <div id="toast" class="toast-notice" role="status"></div>
    <script src="static/js/webrtc.js"></script>
    <script src="static/js/app.js"></script>
</body>
</html>
